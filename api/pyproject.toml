[project]
name = "seznamovak-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.1,<6",
    "django-cors-headers>=4.4",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "gunicorn>=23",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "qrcode[pil]>=8.2",
    "reportlab>=5.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["RUF012", "RUF046", "BLE001"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["misc", "var-annotated"]
