services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./api
    restart: unless-stopped
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_data && gunicorn config.wsgi -b 0.0.0.0:8000 -w 3 --access-logfile -"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - media:/app/media
    ports:
      - "${WEB_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
